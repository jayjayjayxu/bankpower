server {
  listen 80 default_server;
  server_name xubolun1.online www.xubolun1.online _;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  location / {
    return 301 https://www.xubolun1.online$request_uri;
  }
}

server {
  listen 443 ssl default_server;
  http2 on;
  server_name xubolun1.online www.xubolun1.online;

  ssl_certificate /etc/letsencrypt/live/xubolun1.online/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/xubolun1.online/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  root /usr/share/nginx/html;
  index index.html;

  # 页面与只读研究结果不使用浏览器长期缓存，确保站点切换入口和数据口径更新能即时生效。
  add_header Cache-Control "no-cache, no-store, must-revalidate" always;

  location ^~ /energy-compute-ai/api/ {
    proxy_pass http://backend:8081/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /energy-compute-ai/ai-api/ {
    proxy_pass http://ai-service:8090/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
  }

  location = /energy-compute-ai {
    return 301 /energy-compute-ai/;
  }

  location = /energy-compute-ai/compute {
    return 301 /energy-compute-ai/compute/;
  }

  location ^~ /energy-compute-ai/compute/api/ {
    proxy_pass http://compute-backend:8082/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /energy-compute-ai/compute/ {
    proxy_pass http://compute-frontend:80/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /energy-compute-ai/ {
    try_files $uri $uri/ /energy-compute-ai/index.html;
  }

  # 暂时保留旧 API 地址，避免已打开页面和历史请求在迁移期间中断。
  location /api/ {
    proxy_pass http://backend:8081/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /ai-api/ {
    proxy_pass http://ai-service:8090/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
  }

  location = /compute {
    return 301 /energy-compute-ai/compute/;
  }

  location ^~ /compute/ {
    return 301 /energy-compute-ai$request_uri;
  }

  location / {
    return 302 /energy-compute-ai$request_uri;
  }
}
