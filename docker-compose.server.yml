services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在服务器.env中设置MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: spdb_power_finance
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ${DB_INIT_SQL_PATH:-/opt/bankpower-data/spdb_power_finance.sql.gz}:/docker-entrypoint-initdb.d/01-spdb_power_finance.sql.gz:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/spdb_power_finance?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&yearIsDateType=false
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在服务器.env中设置MYSQL_ROOT_PASSWORD}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://121.40.255.180,http://tairan-ecfiplatform.online,http://www.tairan-ecfiplatform.online,https://tairan-ecfiplatform.online,https://www.tairan-ecfiplatform.online}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    restart: unless-stopped

  compute-backend:
    build:
      context: ./compute/backend
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:mysql://mysql:3306/spdb_power_finance?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&yearIsDateType=false
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在服务器.env中设置MYSQL_ROOT_PASSWORD}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://121.40.255.180}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    environment:
      BANKAI_CORE_DIR: /opt/bank-ai
      POLICY_RAG_INDEX_DIR: /opt/policy-index/public_effective
      # This 3.4GB server uses the same PUBLIC+EFFECTIVE policy records with a
      # deterministic local fallback, avoiding a large CPU embedding runtime.
      POLICY_RAG_SEARCH_MODE: lexical
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?请在服务器.env中设置DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      SPDB_DATABASE: spdb_power_finance
      AI_DB_HOST: mysql
      AI_DB_PORT: 3306
      AI_DB_USER: bankpower_ai_reader
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?请在服务器.env中设置AI_DB_PASSWORD}
      AI_API_AUDIT_DIR: /app/runtime/audit
      AI_API_CORS_ALLOWED_ORIGINS: ${AI_API_CORS_ALLOWED_ORIGINS:-http://121.40.255.180}
      AI_API_MAX_CONCURRENCY: 1
      AI_API_DATABASE_HEALTHCHECK: "true"
      AI_API_ENABLE_SQL_DEBUG: "false"
    volumes:
      - /opt/bankpower-ai/core:/opt/bank-ai:ro
      - /opt/bankpower-ai/policy-index:/opt/policy-index:ro
      - ai_audit:/app/runtime/audit
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_POWER_SITE_URL: ${POWER_SITE_URL:-http://121.40.255.180}
        VITE_COMPUTE_SITE_URL: ${COMPUTE_SITE_URL:-http://121.40.255.180/compute/}
    depends_on:
      - backend
      - compute-backend
      - ai-service
    ports:
      - "80:80"
    volumes:
      - certbot_webroot:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped

  compute-frontend:
    build:
      context: ./compute/frontend
      args:
        VITE_APP_BASE: /compute/
        VITE_API_BASE_URL: /compute/api
        VITE_POWER_SITE_URL: ${POWER_SITE_URL:-http://121.40.255.180}
    depends_on:
      - compute-backend
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    profiles: ["maintenance"]
    volumes:
      - certbot_webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

volumes:
  mysql_data:
  ai_audit:
  certbot_webroot:
  letsencrypt:
