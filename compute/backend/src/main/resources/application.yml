server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  error:
    include-message: always
spring:
  application:
    name: power-finance-api
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/spdb_power_finance?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&yearIsDateType=false}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 10000
      read-only: true
  jackson:
    time-zone: Asia/Shanghai
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
